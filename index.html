<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Lock zoom/scroll so tiny fingers can't accidentally pinch-zoom or scroll the page -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f7d6ec" />

  <!-- Full-screen "Add to Home Screen" on iPad -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Enchanted Garden" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />

  <!-- Inline SVG favicon (no image file needed) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>" />

  <title>Makenna's Enchanted Garden</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Floating background sparkles (decorative) -->
  <div class="bg-sparkles" id="bg-sparkles" aria-hidden="true"></div>

  <!-- Top bar: back button (hidden on home) + mute toggle -->
  <header class="topbar" id="topbar">
    <button class="round-btn back-btn" id="back-btn" aria-label="Back to home" hidden>
      <span class="round-btn__icon">🏰</span>
      <span class="round-btn__label">Home</span>
    </button>
    <div class="spacer"></div>
    <button class="round-btn settings-btn" id="settings-btn" aria-label="Sound settings">
      <span class="round-btn__icon" id="volume-icon">🔊</span>
    </button>
  </header>

  <!-- Sound settings popover: volume slider + voice picker -->
  <div class="settings-pop" id="settings-pop" hidden>
    <div class="settings-pop__row">
      <span class="settings-pop__label">🔈 Volume</span>
      <input type="range" id="volume-slider" min="0" max="100" value="85" aria-label="Volume" />
    </div>
    <div class="settings-pop__row settings-pop__voices">
      <span class="settings-pop__label">🎙️ Narrator Voice</span>
      <div class="voice-list" id="voice-list"></div>
      <p class="settings-pop__hint">For the most human-sounding voice, check iPad Settings → Accessibility → Spoken Content → Voices → English, and download an "Enhanced" or "Premium" voice.</p>
    </div>
  </div>

  <!-- HOME SCREEN -->
  <main class="screen home is-active" id="home">
    <div class="home__crown">👑</div>
    <h1 class="home__title" id="app-title">Makenna's Enchanted Garden</h1>
    <p class="home__subtitle">Tap a game to play! ✨</p>
    <div class="home__grid" id="home-grid"><!-- tiles injected by app.js --></div>
  </main>

  <!-- GAME SCREEN (each game renders into #game-root) -->
  <main class="screen game" id="game-screen">
    <div class="game-root" id="game-root"></div>
  </main>

  <!-- Tap-to-start veil: satisfies iOS audio autoplay (audio unlocks on first tap) -->
  <div class="tap-veil" id="tap-veil">
    <div class="tap-veil__card">
      <div class="tap-veil__emoji">🦋🐰🌸</div>
      <div class="tap-veil__title">Makenna's Enchanted Garden</div>
      <button class="tap-veil__btn" id="start-btn">Tap to Begin ✨</button>
    </div>
  </div>

  <!-- Celebration overlay (confetti + praise) -->
  <div class="celebrate" id="celebrate" hidden>
    <div class="celebrate__inner">
      <div class="celebrate__emoji" id="celebrate-emoji">🌟</div>
      <div class="celebrate__msg" id="celebrate-msg">Yay!</div>
    </div>
  </div>

  <!-- Engines first, then games register themselves, then the app boots -->
  <script src="js/audio.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/games/letters.js"></script>
  <script src="js/games/trace.js"></script>
  <script src="js/games/memory.js"></script>
  <script src="js/games/color.js"></script>
  <script src="js/games/animals.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
